<style>
  :root { --bg:#111214; --fg:#f5f5f7; --dim:#3a3b3f; --left:#0a84ff; --right:#ff9f0a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; touch-action:manipulation; }
  #stage { position:fixed; inset:0; display:flex;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .half { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh; cursor:pointer; transition:background .2s; }
  .half.on.l { background:rgba(10,132,255,.14); }
  .half.on.r { background:rgba(255,159,10,.14); }
  .arrow { width:min(40vw,62vh); height:auto; transition:opacity .2s, transform .2s; opacity:.12; }
  .arrow path { fill:var(--dim); transition:fill .2s; }
  .half.on .arrow { opacity:1; transform:scale(1.04); }
  .half.on.l .arrow path { fill:var(--left); }
  .half.on.r .arrow path { fill:var(--right); }
  .name { font-size:clamp(28px,6vh,64px); font-weight:700; letter-spacing:.04em; opacity:.35; transition:opacity .2s; }
  .half.on .name { opacity:1; }
  .divider { width:1px; background:#2a2b2f; margin:8vh 0; }
  #gear { position:fixed; right:calc(16px + env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom));
    width:44px; height:44px; border-radius:22px; border:1px solid #2f3034; background:#1c1d20; color:#8e8e93;
    font-size:20px; display:flex; align-items:center; justify-content:center; z-index:5; }
  #sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:10; }
  #sheet.open { display:flex; }
  .card { background:#1c1d20; border:1px solid #2f3034; border-radius:14px; padding:24px; width:min(420px,88vw); }
  .card h2 { margin:0 0 16px; font-size:17px; font-weight:600; }
  .card label { display:block; font-size:13px; color:#8e8e93; margin:12px 0 6px; }
  .card input { width:100%; font-size:17px; padding:10px 12px; border-radius:8px; border:1px solid #3a3b3f; background:#111214; color:#f5f5f7; -webkit-user-select:text; user-select:text; }
  .swap { width:100%; margin-top:20px; font-size:17px; font-weight:600; padding:14px; border-radius:10px; border:1px solid #ff9f0a; background:rgba(255,159,10,.12); color:#ffb340; }
  .row { display:flex; gap:10px; margin-top:20px; }
  .row button { flex:1; font-size:16px; padding:12px; border-radius:10px; border:1px solid #3a3b3f; background:#2a2b2f; color:#f5f5f7; }
  .row button.primary { background:#0a84ff; border-color:#0a84ff; }
</style>
</head>
<body>
<div id="stage">
  <div class="half l" id="L">
    <svg class="arrow" viewBox="0 0 200 140"><path d="M0 70 L80 0 V40 H200 V100 H80 V140 Z"/></svg>
    <div class="name" id="nameL">ホーム</div>
  </div>
  <div class="divider"></div>
  <div class="half r" id="R">
    <svg class="arrow" viewBox="0 0 200 140"><path d="M200 70 L120 0 V40 H0 V100 H120 V140 Z"/></svg>
    <div class="name" id="nameR">アウェイ</div>
  </div>
</div>
<button id="gear" aria-label="設定">⚙︎</button>
<div id="sheet">
  <div class="card">
    <h2>設定</h2>
    <label for="inL">左側</label><input id="inL" maxlength="12">
    <label for="inR">右側</label><input id="inR" maxlength="12">
    <button id="swap" class="swap">⇄ コートチェンジ（後半）</button>
    <div class="row">
      <button id="clear">矢印を消す</button>
      <button id="ok" class="primary">OK</button>
    </div>
  </div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  };
  let side = store.get('side', '');
  function render(){
    $('L').classList.toggle('on', side === 'L');
    $('R').classList.toggle('on', side === 'R');
    $('nameL').textContent = store.get('nameL', 'ホーム');
    $('nameR').textContent = store.get('nameR', 'アウェイ');
  }
  let lock = null;
  async function keepAwake(){
    try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch(e){}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  function pick(s){ side = s; store.set('side', s); render(); keepAwake(); }
  $('L').addEventListener('click', () => pick('L'));
  $('R').addEventListener('click', () => pick('R'));
  $('gear').addEventListener('click', () => {
    $('inL').value = store.get('nameL', 'ホーム');
    $('inR').value = store.get('nameR', 'アウェイ');
    $('sheet').classList.add('open');
  });
  $('ok').addEventListener('click', () => {
    store.set('nameL', $('inL').value.trim() || 'ホーム');
    store.set('nameR', $('inR').value.trim() || 'アウェイ');
    $('sheet').classList.remove('open'); render();
  });
  $('swap').addEventListener('click', () => {
    const l = $('inL').value.trim() || store.get('nameL', 'ホーム');
    const r = $('inR').value.trim() || store.get('nameR', 'アウェイ');
    store.set('nameL', r); store.set('nameR', l);
    pick(side === 'L' ? 'R' : side === 'R' ? 'L' : '');
    $('sheet').classList.remove('open');
  });
  $('clear').addEventListener('click', () => { pick(''); $('sheet').classList.remove('open'); });
  $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('sheet').classList.remove('open'); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  render();
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
