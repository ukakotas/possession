<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<style>
  :root { --bg:#111214; --fg:#f5f5f7; --dim:#3a3b3f; --home:#0a84ff; --away:#ff9f0a; --homeInk:#fff; --awayInk:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; touch-action:manipulation; }
  #stage { position:fixed; inset:0; display:flex;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .half { flex:1; display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:#16171a; transition:background .25s; }
  .half.on.home { background:var(--home); }
  .half.on.away { background:var(--away); }
  .team { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:.28; transition:opacity .25s, transform .25s; padding:0 3vw; text-align:center; }
  .half.on .team { opacity:1; transform:scale(1.03); }
  .half.on.home .team { color:var(--homeInk); }
  .half.on.away .team { color:var(--awayInk); }
  .logo { position:absolute; bottom:calc(100% + 4vh); left:50%; transform:translateX(-50%); height:clamp(80px,26vh,300px); width:auto; max-width:34vw; object-fit:contain; display:none; }
  .logo.has { display:block; }
  .name { font-size:clamp(30px,7.5vh,84px); font-weight:800; letter-spacing:.03em; line-height:1.15; white-space:nowrap; }
  .badge { font-size:clamp(16px,3.4vh,34px); font-weight:800; letter-spacing:.3em; padding:.35em 1.1em .35em 1.4em;
    border-radius:999px; background:#fff; color:#111214; visibility:hidden;
    position:absolute; top:calc(100% + 3vh); left:50%; transform:translateX(-50%); white-space:nowrap; }
  .half.on .badge { visibility:visible; }
  .half.on.home .badge { background:var(--homeInk); color:var(--home); }
  .half.on.away .badge { background:var(--awayInk); color:var(--away); }
  #mid { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:clamp(70px,12vw,150px); height:clamp(70px,12vw,150px);
    border-radius:50%; background:#111214; border:4px solid #fff; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:3; transition:opacity .2s; opacity:0; }
  #mid.show { opacity:1; }
  #mid svg { width:58%; height:58%; transition:transform .25s; }
  #mid.left svg { transform:rotate(180deg); }
  #mid path { fill:#fff; }
  #gear { position:fixed; right:calc(16px + env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom));
    width:44px; height:44px; border-radius:22px; border:1px solid #2f3034; background:#1c1d20; color:#8e8e93;
    font-size:20px; display:flex; align-items:center; justify-content:center; z-index:5; }
  #sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:10; }
  #sheet.open { display:flex; }
  .card { background:#1c1d20; border:1px solid #2f3034; border-radius:14px; padding:22px 24px; width:min(460px,90vw); max-height:92vh; overflow:auto; }
  .card h2 { margin:0 0 4px; font-size:17px; font-weight:600; }
  .sec { margin-top:16px; padding-top:14px; border-top:1px solid #2a2b2f; }
  .sec:first-of-type { border-top:none; padding-top:4px; }
  .lbl { font-size:13px; color:#8e8e93; margin:0 0 8px; }
  .fixed { font-size:17px; font-weight:600; }
  .card input[type=text] { width:100%; font-size:17px; padding:10px 12px; border-radius:8px; border:1px solid #3a3b3f; background:#111214; color:#f5f5f7; -webkit-user-select:text; user-select:text; }
  .sel { width:100%; font-size:17px; padding:10px 12px; margin-bottom:8px; border-radius:8px; border:1px solid #3a3b3f; background:#111214; color:#f5f5f7; }
  .logorow { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .thumb { width:52px; height:52px; border-radius:8px; border:1px solid #3a3b3f; background:#111214; object-fit:contain; }
  .sw { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center; }
  .sw button { width:34px; height:34px; border-radius:50%; border:1px solid #3a3b3f; padding:0; }
  .sw button.sel { outline:3px solid #fff; outline-offset:2px; }
  .sw label { position:relative; width:34px; height:34px; border-radius:50%; border:1px dashed #8e8e93; display:flex; align-items:center; justify-content:center; color:#8e8e93; font-size:18px; overflow:hidden; }
  .sw label input { position:absolute; inset:0; opacity:0; width:100%; height:100%; }
  .btn { font-size:15px; padding:10px 14px; border-radius:10px; border:1px solid #3a3b3f; background:#2a2b2f; color:#f5f5f7; }
  .file { position:relative; overflow:hidden; }
  .file input { position:absolute; inset:0; opacity:0; }
  .swap { width:100%; margin-top:18px; font-size:17px; font-weight:600; padding:14px; border-radius:10px; border:1px solid #ff9f0a; background:rgba(255,159,10,.12); color:#ffb340; }
  .row { display:flex; gap:10px; margin-top:14px; }
  .row .btn { flex:1; font-size:16px; padding:12px; }
  .btn.primary { background:#0a84ff; border-color:#0a84ff; }
</style>
</head>
<body>
<div id="stage">
  <div class="half" id="L">
    <div class="team"><img class="logo" id="logoL" alt=""><div class="name" id="nameL"></div><div class="badge">BALL</div></div>
  </div>
  <div class="half" id="R">
    <div class="team"><img class="logo" id="logoR" alt=""><div class="name" id="nameR"></div><div class="badge">BALL</div></div>
  </div>
</div>
<div id="mid"><svg viewBox="0 0 100 100"><path d="M18 38 H56 V18 L90 50 L56 82 V62 H18 Z"/></svg></div>
<button id="gear" aria-label="設定">⚙︎</button>
<div id="sheet">
  <div class="card">
    <h2>設定</h2>
    <div class="sec">
      <div class="lbl">ホーム</div>
      <div class="fixed">スサノオマジック</div>
      <div class="logorow">
        <img class="thumb" id="thumbH" alt="">
        <label class="btn file">ロゴを選ぶ<input type="file" accept="image/*" id="fileH"></label>
        <button class="btn" id="delH">削除</button>
      </div>
      <div class="sw" id="swH"></div>
    </div>
    <div class="sec">
      <div class="lbl">アウェイ（相手チーム）</div>
      <select id="selA" class="sel"><option value="">Bプレミアのチームから選ぶ…</option></select>
      <input type="text" id="inA" maxlength="14" placeholder="チーム名（手入力も可）">
      <div class="logorow">
        <img class="thumb" id="thumbA" alt="">
        <label class="btn file">ロゴを選ぶ<input type="file" accept="image/*" id="fileA"></label>
        <button class="btn" id="delA">削除</button>
      </div>
      <div class="sw" id="swA"></div>
    </div>
    <button id="swap" class="swap">⇄ コートチェンジ（後半）</button>
    <div class="row">
      <button class="btn" id="clear">表示を消す</button>
      <button class="btn primary" id="ok">OK</button>
    </div>
  </div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const HOME = 'スサノオマジック';
  const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } },
    del(k){ try { localStorage.removeItem(k); } catch(e){} }
  };
  // 旧版のデータを引き継ぐ
  if (store.get('homeSide', null) === null) {
    const oldR = store.get('nameR', null), oldSide = store.get('side', '');
    store.set('homeSide', 'L');
    if (oldR && oldR !== 'アウェイ') store.set('awayName', oldR);
    store.set('poss', oldSide === 'L' ? 'H' : oldSide === 'R' ? 'A' : '');
  }
  const S = {
    get homeSide(){ return store.get('homeSide', 'L'); },
    get poss(){ return store.get('poss', ''); },
    get awayName(){ return store.get('awayName', 'アウェイ'); }
  };
  const PAL = ['#0067c0','#1a4472','#36a7cc','#e60012','#eb6101','#fabe00','#e3a857','#00913a','#6a3fa0','#ec008c','#1c2340','#ffffff'];
  // Bプレミア 2026-27 参加26クラブ（色は各クラブのチームカラーの近似値）
  const TEAMS = [
    ['東地区', [['レバンガ北海道','#b9c42f'],['仙台89ERS','#fabe00'],['秋田ノーザンハピネッツ','#ec008c'],['茨城ロボッツ','#3b4c8e'],['宇都宮ブレックス','#1a4472'],['群馬クレインサンダーズ','#ffd400'],['アルティーリ千葉','#1c2340'],['千葉ジェッツ','#ed1c24'],['アルバルク東京','#e6002f'],['東京サンロッカーズ','#6a3fa0'],['川崎ブレイブサンダース','#c22047'],['横浜ビー・コルセアーズ','#0f2350'],['富山グラウジーズ','#e60033']]],
    ['西地区', [['信州ブレイブウォリアーズ','#3d496b'],['三遠ネオフェニックス','#e60012'],['シーホース三河','#0054a6'],['名古屋ダイヤモンドドルフィンズ','#e60033'],['滋賀レイクス','#0075c2'],['京都ハンナリーズ','#2a83a2'],['大阪エヴェッサ','#ed1c24'],['神戸ストークス','#00913a'],['広島ドラゴンフライズ','#eb6101'],['佐賀バルーナーズ','#36a7cc'],['長崎ヴェルカ','#1f2e55'],['琉球ゴールデンキングス','#e3a857']]]
  ];
  const SHORT = {'レバンガ北海道':'北海道','仙台89ERS':'仙台','秋田ノーザンハピネッツ':'秋田','茨城ロボッツ':'茨城','宇都宮ブレックス':'宇都宮','群馬クレインサンダーズ':'群馬','アルティーリ千葉':'A千葉','千葉ジェッツ':'千葉J','アルバルク東京':'A東京','東京サンロッカーズ':'東京SR','川崎ブレイブサンダース':'川崎','横浜ビー・コルセアーズ':'横浜BC','富山グラウジーズ':'富山','信州ブレイブウォリアーズ':'信州','三遠ネオフェニックス':'三遠','シーホース三河':'三河','名古屋ダイヤモンドドルフィンズ':'名古屋D','滋賀レイクス':'滋賀','京都ハンナリーズ':'京都','大阪エヴェッサ':'大阪','神戸ストークス':'神戸','広島ドラゴンフライズ':'広島','佐賀バルーナーズ':'佐賀','長崎ヴェルカ':'長崎','琉球ゴールデンキングス':'琉球'};
  (function(){ const s = $('selA'); TEAMS.forEach(([g, list]) => { const og = document.createElement('optgroup'); og.label = g; list.forEach(([n, c]) => { const o = document.createElement('option'); o.value = n; o.dataset.c = c; o.textContent = n; og.appendChild(o); }); s.appendChild(og); });
    s.addEventListener('change', () => { const o = s.selectedOptions[0]; if (!o || !o.value) return; $('inA').value = o.value; store.set('awayName', o.value); store.set('colorA', o.dataset.c); render(); }); })();
  function ink(hex){ const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255; return (0.299*r + 0.587*g + 0.114*b) > 165 ? '#111214' : '#ffffff'; }
  function buildSw(k, cur){
    const box = $('sw' + k); box.innerHTML = '';
    PAL.forEach(c => { const b = document.createElement('button'); b.style.background = c; if (c === cur) b.className = 'sel';
      b.addEventListener('click', () => { store.set('color' + k, c); render(); }); box.appendChild(b); });
    const l = document.createElement('label'); l.textContent = '＋'; if (!PAL.includes(cur)) { l.style.background = cur; l.style.borderStyle = 'solid'; l.style.outline = '3px solid #fff'; l.style.outlineOffset = '2px'; }
    const i = document.createElement('input'); i.type = 'color'; i.value = cur;
    i.addEventListener('change', () => { store.set('color' + k, i.value); render(); }); l.appendChild(i); box.appendChild(l);
  }
  function applyColors(){
    const h = store.get('colorH', '#0067c0'), a = store.get('colorA', '#ff9f0a'), st = document.documentElement.style;
    st.setProperty('--home', h); st.setProperty('--away', a); st.setProperty('--homeInk', ink(h)); st.setProperty('--awayInk', ink(a));
    buildSw('H', h); buildSw('A', a);
  }
  function fitNames(){
    const max = window.innerWidth * 0.34;
    for (const side of ['L', 'R']) { const el = $('name' + side); el.style.fontSize = '';
      let fs = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > max && fs > 16) { fs -= 2; el.style.fontSize = fs + 'px'; } }
  }
  window.addEventListener('resize', () => fitNames());
  function teamOn(side){ return side === S.homeSide ? 'H' : 'A'; }
  function render(){
    applyColors();
    for (const side of ['L', 'R']) {
      const t = teamOn(side), el = $(side);
      el.classList.toggle('home', t === 'H');
      el.classList.toggle('away', t === 'A');
      el.classList.toggle('on', S.poss === t);
      $('name' + side).textContent = t === 'H' ? HOME : S.awayName;
      const src = store.get(t === 'H' ? 'logoH' : 'logoA', '');
      const img = $('logo' + side);
      img.src = src || BLANK; img.classList.toggle('has', !!src);
    }
    const onSide = S.poss === '' ? '' : (teamOn('L') === S.poss ? 'L' : 'R');
    $('mid').classList.toggle('show', !!onSide);
    $('mid').classList.toggle('left', onSide === 'L');
    fitNames();
    $('thumbH').src = store.get('logoH', '') || BLANK;
    $('thumbA').src = store.get('logoA', '') || BLANK;
  }
  let lock = null;
  async function keepAwake(){
    try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch(e){}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  function setPoss(p){ store.set('poss', p); render(); keepAwake(); }
  $('L').addEventListener('click', () => setPoss(teamOn('L')));
  $('R').addEventListener('click', () => setPoss(teamOn('R')));

  function loadLogo(file, key){
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 360, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      if (!store.set(key, c.toDataURL('image/png'))) store.set(key, c.toDataURL('image/jpeg', 0.85));
      render();
    };
    img.src = url;
  }
  $('fileH').addEventListener('change', e => { loadLogo(e.target.files[0], 'logoH'); e.target.value = ''; });
  $('fileA').addEventListener('change', e => { loadLogo(e.target.files[0], 'logoA'); e.target.value = ''; });
  $('delH').addEventListener('click', () => { store.del('logoH'); render(); });
  $('delA').addEventListener('click', () => { store.del('logoA'); render(); });

  function saveName(){ store.set('awayName', $('inA').value.trim() || 'アウェイ'); }
  function close(){ saveName(); $('sheet').classList.remove('open'); render(); }
  $('gear').addEventListener('click', () => { $('inA').value = S.awayName === 'アウェイ' ? '' : S.awayName; render(); $('sheet').classList.add('open'); });
  $('ok').addEventListener('click', close);
  $('swap').addEventListener('click', () => { store.set('homeSide', S.homeSide === 'L' ? 'R' : 'L'); close(); });
  $('clear').addEventListener('click', () => { store.set('poss', ''); close(); });
  $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') close(); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  render();
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
